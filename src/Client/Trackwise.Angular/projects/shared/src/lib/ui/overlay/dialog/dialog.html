<!--
  `*hlmDialogPortal` is required: BrnDialog.open() early-returns unless a BrnDialogContent has
  registered a template with it, so without it the dialog never opens - silently, with no error.

  Everything below the portal renders into the CDK overlay container, NOT into <ui-dialog>. Hence the
  inline width here rather than on the host, and the document-level Escape handler.
-->
<hlm-dialog
  [state]="state()"
  (stateChanged)="onStateChanged($event)"
  [hasBackdrop]="modal()"
  [aria-labelledby]="titleId"
  [disableClose]="true"
>
  <hlm-dialog-content
    *hlmDialogPortal
    [id]="panelId"
    [showCloseButton]="closable()"
    [style.width]="panelWidth()"
    [style.max-width]="panelMaxWidth()"
    [style.height]="panelHeight()"
    [style.max-height]="panelMaxHeight()"
    [style.gap]="compact() ? '0' : null"
    [style.position]="placement() === 'bottom-right' && !fullScreen() ? 'fixed' : null"
    [style.right.px]="
      placement() === 'bottom-right' && !fullScreen() ? placementInset().right : null
    "
    [style.bottom.px]="
      placement() === 'bottom-right' && !fullScreen() ? placementInset().bottom : null
    "
    [style.top]="placement() === 'bottom-right' && !fullScreen() ? 'auto' : null"
    [style.left]="placement() === 'bottom-right' && !fullScreen() ? 'auto' : null"
    [style.animation]="placement() === 'bottom-right' ? 'none' : null"
    [style.margin]="fullScreen() || placement() === 'bottom-right' ? '0' : null"
    [class.ui-dialog-fullscreen]="fullScreen()"
    [class.!rounded-none]="fullScreen()"
    class="max-h-[calc(100vh-2rem)]"
    cdkDrag
    cdkDragBoundary=".cdk-overlay-container"
    [cdkDragFreeDragPosition]="dragPosition()"
    (cdkDragStarted)="onDragStarted()"
    [cdkDragDisabled]="fullScreen() || !draggable()"
  >
    <!--
      `cursor` is an inline style, not a class: HlmDialogHeader drives its own class list through
      spartan's `classes()` manager, which rewrites className and would drop a `[class.x]` set here.
    -->
    <hlm-dialog-header
      cdkDragHandle
      [style.cursor]="draggable() ? 'move' : null"
      [style.padding]="compact() ? '0.5rem 2.5rem 0.5rem 0.75rem' : null"
    >
      @if (headerTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl" />
      } @else {
        <h2 [id]="titleId" class="text-lg leading-none font-medium">{{ header() }}</h2>
      }
    </hlm-dialog-header>

    <!-- min-h-0 lets this grid row actually shrink, which is what allows it to scroll instead of
         pushing the footer out of the viewport on a tall dialog. -->
    <div
      data-slot="dialog-body"
      class="min-h-0 flex-1 overflow-y-auto"
      [class.p-4]="!compact()"
      [class.sm:p-6]="!compact()"
      [class.p-3]="compact()"
    >
      <ng-content />
      @if (contentTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl" />
      }
    </div>

    @if (footerTpl(); as tpl) {
      <hlm-dialog-footer [style.padding]="compact() ? '0.5rem 0.75rem' : null">
        <ng-container *ngTemplateOutlet="tpl" />
      </hlm-dialog-footer>
    }

    @if (resizable()) {
      <div
        data-slot="dialog-resize-grip"
        class="absolute right-0 bottom-0 h-4 w-4 cursor-se-resize touch-none"
        (pointerdown)="startResize($event)"
      ></div>
    }
  </hlm-dialog-content>
</hlm-dialog>
