<ui-dialog
  [header]="isEdit() ? 'Edit fill-up' : 'Log fill-up'"
  [(open)]="open"
  [modal]="true"
  width="40rem"
  (opened)="onOpened()"
>
  <form [formRoot]="form">
    <ui-grid container spacing="3">
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Filled" for="filledAt" [required]="true">
          <ui-date-field
            inputId="filledAt"
            [formField]="form.filledAt"
            [showTime]="true"
            [showIcon]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Truck" for="fillTruck" [required]="true">
          <ui-select-field
            id="fillTruck"
            [formField]="form.truckId"
            [options]="trucks()"
            optionLabel="name"
            optionValue="id"
            placeholder="Pick the truck"
            [filter]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 4 }">
        <ui-form-field label="Fleet card" for="fleetCard" hint="Clear it for cash">
          <ui-select-field
            id="fleetCard"
            [formField]="form.fleetCard"
            [options]="cardOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Cash / other"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6, md: 4 }">
        <ui-form-field label="Liters" for="liters" [required]="true">
          <ui-number-field
            id="liters"
            [formField]="form.liters"
            [minFractionDigits]="0"
            [maxFractionDigits]="3"
            [fluid]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6, md: 4 }">
        <ui-form-field
          label="Amount"
          for="fillAmount"
          [required]="true"
          [hint]="
            pricePerLiter() ? (pricePerLiter() | number: '1.2-2') + ' per liter' : 'VAT included'
          "
        >
          <ui-number-field
            id="fillAmount"
            [formField]="form.amount"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            [fluid]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Odometer (km)" for="odometer" hint="Needed for km per liter">
          <ui-number-field
            id="odometer"
            [formField]="form.odometerReading"
            [maxFractionDigits]="0"
            [fluid]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Trip" for="fillTrip" hint="Optional">
          <ui-select-field
            id="fillTrip"
            [formField]="form.tripId"
            [options]="trips()"
            optionLabel="label"
            optionValue="id"
            [placeholder]="model().truckId ? 'Pick the trip' : 'Pick a truck first'"
            [loading]="loadingTrips()"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Station" for="station" hint="e.g. Shell Molino, Bacoor">
          <ui-text-field id="station" [formField]="form.station" />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Notes" for="fillNotes">
          <ui-text-field id="fillNotes" [formField]="form.notes" />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 12 }">
        @for (slot of [receiptSlot()]; track slot) {
          <app-expense-receipt-upload
            [chooseLabel]="fillUp()?.hasReceipt ? 'Replace receipt' : 'Attach receipt'"
            (uploaded)="onReceiptUploaded($event)"
          />
        }
      </ui-grid>
    </ui-grid>

    <div class="mt-4 flex justify-end gap-2">
      <ui-button
        appearance="text"
        [label]="isEdit() ? 'Cancel' : 'Done'"
        (click)="open.set(false)"
      />
      <ui-button
        type="submit"
        icon="save"
        [label]="isEdit() ? 'Save' : 'Log and next'"
        [loading]="form().submitting()"
      />
    </div>
  </form>
</ui-dialog>
