<ui-page-header
  [title]="'Edit ' + (caseNumber() ?? 'incident')"
  [backLink]="'/incidents/' + id"
/>

@if (isLoading()) {
  <ui-spinner />
} @else {
  <ui-card>
    <form [formRoot]="form">
      <app-incident-form [field]="form" />
      <div class="mt-6 flex justify-end gap-2">
        <ui-button appearance="text" label="Cancel" (click)="cancel()" />
        <ui-button type="submit" icon="save" label="Save" [loading]="form().submitting()" />
      </div>
    </form>
  </ui-card>
}
