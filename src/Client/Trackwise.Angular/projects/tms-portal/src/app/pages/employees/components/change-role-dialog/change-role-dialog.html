<ui-dialog
  header="Change role"
  [(open)]="visible"
  [modal]="true"
  [resizable]="true"
  (closed)="close()"
>
  @if (isLoading() || form().submitting()) {
    <ui-spinner />
  }

  <p class="mb-3">
    Currently:
    <strong>{{ currentRole()?.displayName || "No role" }}</strong>
    <br />
    <span class="text-muted-foreground text-sm">
      You can only pick roles that can't change access (roles, employees, invitations, API keys,
      company settings) beyond what you can.
    </span>
  </p>

  <form [formRoot]="form">
    <div class="mb-3">
      <label for="role" class="form-label">New role</label>
      <ui-select-field
        [formField]="form.role"
        appendTo="body"
        [options]="roles()"
        optionValue="name"
        optionLabel="displayName"
      />
    </div>
    <ui-button
      type="submit"
      icon="pencil"
      label="Change role"
      [loading]="form().submitting()"
      [disabled]="isLoading()"
    />
  </form>
</ui-dialog>
