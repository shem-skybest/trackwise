<div class="animate-in fade-in space-y-4">
  <ui-page-header title="Edit Tariff" backLink="/tariffs" />

  @if (tariff(); as currentTariff) {
    <app-tariff-form
      mode="edit"
      [initial]="initialFormValue()"
      [isLoading]="isLoading()"
      (save)="update($event)"
    />
  } @else if (isLoading()) {
    <div class="flex justify-center py-12">Loading tariff...</div>
  } @else {
    <div class="text-muted-foreground">Tariff not found.</div>
  }
</div>
