<ui-grid container spacing="3">
  <ui-grid [size]="{ xs: 12, lg: 9, xl: 8 }">
    <form [formRoot]="form">
      <ui-stack gap="4">
        <ui-stack tag="section" gap="3">
          <ui-stack direction="row" gap="2" align="start">
            <ui-icon name="package" color="secondary" class="mt-1" />
            <ui-stack gap="0">
              <ui-typography variant="overline" color="secondary">Commodity Details</ui-typography>
              <ui-typography variant="caption" color="muted">
                The canonical record for these goods, replacing the phrase typed onto each workfile.
              </ui-typography>
            </ui-stack>
          </ui-stack>

          <ui-surface variant="elevated" [border]="true">
            <ui-stack gap="3">
              <ui-grid container spacing="3">
                <ui-grid [size]="{ xs: 12, md: 8 }">
                  <ui-form-field label="Name" for="name" [required]="true">
                    <ui-text-field id="name" [formField]="form.name" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field label="Code" for="code" [hint]="codeHint()">
                    <ui-text-field id="code" [formField]="form.code" type="text" [maxlength]="30" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field
                    label="HS code"
                    for="hsCode"
                    hint="Six to ten digits. Shared across similar goods."
                  >
                    <ui-text-field id="hsCode" [formField]="form.hsCode" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field
                    label="Branch"
                    for="branchId"
                    hint="One branch, or every branch if shared"
                  >
                    <ui-select-field
                      id="branchId"
                      [formField]="form.branchId"
                      [options]="branchOptions()"
                      optionLabel="label"
                      optionValue="value"
                    />
                  </ui-form-field>
                </ui-grid>
              </ui-grid>

              <ui-form-field label="Description" for="description" hint="Optional">
                <ui-textarea-field id="description" [formField]="form.description" [rows]="2" />
              </ui-form-field>
            </ui-stack>
          </ui-surface>
        </ui-stack>

        <ui-stack tag="section" gap="3">
          <ui-stack direction="row" gap="2" align="start">
            <ui-icon name="triangle-alert" color="secondary" class="mt-1" />
            <ui-stack gap="0">
              <ui-typography variant="overline" color="secondary">Handling</ui-typography>
              <ui-typography variant="caption" color="muted">
                Answered once here rather than re-asked, differently, on every booking.
              </ui-typography>
            </ui-stack>
          </ui-stack>

          <ui-surface variant="elevated" [border]="true">
            <ui-stack gap="3">
              <ui-form-field label="Hazardous" for="isHazardous">
                <ui-toggle-field
                  id="isHazardous"
                  [formField]="form.isHazardous"
                  label="Dangerous goods"
                />
              </ui-form-field>

              <ui-grid container spacing="3">
                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field
                    label="UN number"
                    for="unNumber"
                    hint="Four digits. Leave blank while unclassified."
                  >
                    <ui-text-field id="unNumber" [formField]="form.unNumber" type="text" />
                  </ui-form-field>
                </ui-grid>
              </ui-grid>

              <ui-form-field label="Temperature controlled" for="requiresTemperatureControl">
                <ui-toggle-field
                  id="requiresTemperatureControl"
                  [formField]="form.requiresTemperatureControl"
                  label="Needs a reefer"
                />
              </ui-form-field>

              <ui-form-field label="Notes" for="notes" hint="Optional">
                <ui-textarea-field id="notes" [formField]="form.notes" [rows]="3" />
              </ui-form-field>

              <ui-form-field label="Active" for="isActive">
                <ui-toggle-field
                  id="isActive"
                  [formField]="form.isActive"
                  label="Offered for new work"
                />
              </ui-form-field>
            </ui-stack>
          </ui-surface>
        </ui-stack>

        <ui-stack direction="row" gap="2" align="center">
          <ui-button type="submit" icon="save" [label]="submitLabel()" [disabled]="isLoading()" />

          <ui-button
            type="button"
            appearance="text"
            icon="arrow-left"
            label="Cancel"
            [routerLink]="['/master-data/commodities']"
            [disabled]="isLoading()"
          />
        </ui-stack>
      </ui-stack>
    </form>
  </ui-grid>
</ui-grid>
