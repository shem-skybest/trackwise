<div class="animate-in fade-in space-y-4">
  <ui-page-header title="Tariffs" addRoute="/tariffs/add" addTooltip="Add a new tariff">
    <ui-stack direction="row" gap="1">
      <ui-button
        appearance="text"
        size="lg"
        icon="file-input"
        [rounded]="true"
        uiTooltip="Import tariffs from PDF"
        ariaLabel="Import tariffs from PDF"
        [routerLink]="['/tariffs/import']"
      />

      <ui-button
        appearance="text"
        size="lg"
        icon="download"
        [rounded]="true"
        uiTooltip="Export tariffs to CSV"
        ariaLabel="Export tariffs to CSV"
        (click)="exportToCsv()"
        [disabled]="store.isEmpty()"
      />
    </ui-stack>
  </ui-page-header>

  <!-- Filters -->
  <app-tariffs-filter-panel
    [isLoading]="store.isLoading()"
    (filtersChanged)="onFiltersChanged($event)"
    (searchChanged)="onSearchChanged($event)"
  />

  <!-- Table -->
  <app-tariffs-table
    [data]="store.data()"
    [isLoading]="store.isLoading()"
    [error]="store.error()"
    [isEmpty]="store.isEmpty()"
    [totalRecords]="store.totalRecords()"
    [pageSize]="store.pageSize()"
    [first]="store.first()"
    (lazyLoad)="store.onLazyLoad($event)"
    (retry)="store.retry()"
    (addTariff)="addTariff()"
    (deleteTariff)="askDeactivate($event)"
  />
</div>
