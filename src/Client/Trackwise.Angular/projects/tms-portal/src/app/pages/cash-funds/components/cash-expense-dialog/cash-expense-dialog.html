<ui-dialog
  [header]="isEdit() ? 'Edit expense' : 'Add expense'"
  [(open)]="open"
  [modal]="true"
  width="36rem"
  (opened)="onOpened()"
>
  <form [formRoot]="form">
    <ui-grid container spacing="3">
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="Paid on" for="spentOn" [required]="true">
          <ui-date-field inputId="spentOn" [formField]="form.spentOn" [showIcon]="true" />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="For" for="category" [required]="true">
          <ui-select-field
            id="category"
            [formField]="form.category"
            [options]="categoryOptions"
            optionLabel="label"
            optionValue="value"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 8 }">
        <ui-form-field label="Description" for="description" [required]="true">
          <ui-text-field
            id="description"
            [formField]="form.description"
            placeholder="PFI passway"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 4 }">
        <ui-form-field label="Amount" for="expenseAmount" [required]="true">
          <ui-number-field
            id="expenseAmount"
            [formField]="form.amount"
            [minFractionDigits]="0"
            [maxFractionDigits]="2"
            [fluid]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="Truck" for="expenseTruck" hint="Optional for office purchases">
          <ui-select-field
            id="expenseTruck"
            [formField]="form.truckId"
            [options]="trucks()"
            optionLabel="number"
            optionValue="id"
            placeholder="Pick a truck"
            [filter]="true"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="Trip" for="expenseTrip">
          <ui-select-field
            id="expenseTrip"
            [options]="trips()"
            optionLabel="label"
            optionValue="id"
            [value]="model().tripId"
            (valueChange)="onTripChange($event)"
            [placeholder]="model().truckId ? 'Pick the trip' : 'Pick a truck first'"
            [disabled]="!model().truckId"
            [loading]="loadingTrips()"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="Paid by" for="spentBy" hint="The trip's driver when left empty">
          <app-search-employee id="spentBy" [formField]="form.spentBy" />
        </ui-form-field>
      </ui-grid>
      <ui-grid [size]="{ xs: 6 }">
        <ui-form-field label="Receipt no." for="receiptNumber" hint="Optional">
          <ui-text-field id="receiptNumber" [formField]="form.receiptNumber" />
        </ui-form-field>
      </ui-grid>
    </ui-grid>

    <div class="mt-4 flex justify-end gap-2">
      <ui-button
        appearance="text"
        [label]="isEdit() ? 'Cancel' : 'Done'"
        (click)="open.set(false)"
      />
      <ui-button
        type="submit"
        icon="save"
        [label]="isEdit() ? 'Save' : 'Add and next'"
        [loading]="form().submitting()"
      />
    </div>
  </form>
</ui-dialog>
