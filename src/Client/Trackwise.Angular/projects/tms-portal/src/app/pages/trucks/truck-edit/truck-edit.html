<ui-page-header [title]="pageTitle()" />

@if (isLoading() && !truck()) {
  <ui-stack align="center" justify="center" class="py-16 text-center">
    <ui-spinner />
  </ui-stack>
} @else {
  <app-truck-form
    [mode]="mode()"
    [initial]="truck()"
    [isLoading]="isLoading()"
    (save)="onSave($event)"
    (remove)="onRemove()"
  />

  @if (id()) {
    <div class="max-w-5xl mt-6">
      <app-master-data-history entity="truck" [recordId]="id()!" [version]="historyVersion()" />
    </div>
  }
}
