<div class="animate-in fade-in space-y-4">
  <ui-page-header
    title="Business Partners"
    addRoute="/master-data/partners/add"
    addTooltip="Add a new business partner"
  />

  <ui-card>
    <ui-stack gap="3" class="p-4">
      <ui-grid container spacing="3">
        <ui-grid [size]="{ xs: 12, md: 4 }">
          <ui-form-field label="Search" for="search" hint="Name, code or TIN">
            <ui-text-field
              id="search"
              icon="search"
              placeholder="Search partners..."
              (input)="onSearch($any($event.target).value)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 3 }">
          <ui-form-field label="Role" for="role">
            <ui-select-field
              id="role"
              [options]="roleOptions"
              optionLabel="label"
              optionValue="value"
              [value]="selectedRole()"
              (valueChange)="onRoleChange($event)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 3 }">
          <ui-form-field label="Approval" for="approvalState">
            <ui-select-field
              id="approvalState"
              [options]="approvalStateOptions"
              optionLabel="label"
              optionValue="value"
              [value]="selectedApprovalState()"
              (valueChange)="onApprovalStateChange($event)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 2 }">
          <ui-form-field label="Deleted records" for="includeDeleted">
            <ui-select-field
              id="includeDeleted"
              [options]="deletedOptions"
              optionLabel="label"
              optionValue="value"
              [value]="includeDeleted()"
              (valueChange)="onIncludeDeletedChange($event)"
            />
          </ui-form-field>
        </ui-grid>
      </ui-grid>
    </ui-stack>
  </ui-card>

  <app-partners-table
    [data]="store.data()"
    [isLoading]="store.isLoading()"
    [error]="store.error()"
    [isEmpty]="store.isEmpty()"
    [totalRecords]="store.totalRecords()"
    [pageSize]="store.pageSize()"
    [first]="store.first()"
    [canManage]="canManage"
    (lazyLoad)="store.onLazyLoad($event)"
    (retry)="store.retry()"
    (addPartner)="addPartner()"
    (restorePartner)="restore($event)"
  />
</div>
