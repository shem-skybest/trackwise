<div class="border-default bg-elevated rounded-lg border">
  <div class="border-default flex items-center justify-between border-b p-3">
    <div class="flex items-center gap-2">
      <ui-icon name="map" class="text-foreground" />
      <span class="font-medium">Fleet Map</span>
    </div>
    <div class="flex items-center gap-3 text-sm">
      @if ((map()?.trucksWithLocation() ?? 0) > 0) {
        <span class="text-muted-foreground">
          <ui-icon name="map-pin" class="text-success mr-1" />
          {{ map()?.trucksWithLocation() }} tracked
        </span>
      }
      @if ((map()?.trucksWithoutLocation() ?? 0) > 0) {
        <span class="text-muted-foreground">
          <ui-icon name="circle-help" class="text-warning mr-1" />
          {{ map()?.trucksWithoutLocation() }} no location
        </span>
      }
    </div>
  </div>

  <div class="relative h-125">
    <app-trucks-map height="500px" />
  </div>
</div>
