<div class="animate-in fade-in space-y-4">
  <ui-page-header title="Edit Currency" backLink="/master-data/currencies">
    <ui-button
      type="button"
      appearance="text"
      intent="danger"
      icon="trash"
      label="Delete"
      [disabled]="isBusy() || isLoading()"
      (click)="confirmDelete()"
    />
  </ui-page-header>

  @if (isLoading()) {
    <div class="flex justify-center py-12">
      <ui-spinner />
    </div>
  } @else {
    <app-currency-form
      [currency]="currency()"
      [isLoading]="isBusy()"
      [isEdit]="true"
      submitLabel="Save Changes"
      (save)="update($event)"
    />

    @if (id) {
      <div class="max-w-5xl">
        <app-master-data-history entity="currency" [recordId]="id" [version]="historyVersion()" />
      </div>
    }
  }
</div>
