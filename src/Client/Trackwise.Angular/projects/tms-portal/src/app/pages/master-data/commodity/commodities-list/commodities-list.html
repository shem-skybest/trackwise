<div class="animate-in fade-in space-y-4">
  <ui-page-header
    title="Commodities"
    addRoute="/master-data/commodities/add"
    addTooltip="Add a new commodity"
  />

  <ui-card>
    <ui-stack gap="3" class="p-4">
      <ui-grid container spacing="3">
        <ui-grid [size]="{ xs: 12, md: 4 }">
          <ui-form-field label="Search" for="search" hint="Name, code or HS code">
            <ui-text-field
              id="search"
              icon="search"
              placeholder="Search commodities..."
              (input)="onSearch($any($event.target).value)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 3 }">
          <ui-form-field label="Handling" for="handling">
            <ui-select-field
              id="handling"
              [options]="handlingOptions"
              optionLabel="label"
              optionValue="value"
              [value]="selectedHandling()"
              (valueChange)="onHandlingChange($event)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 2 }">
          <ui-form-field label="Status" for="status">
            <ui-select-field
              id="status"
              [options]="statusOptions"
              optionLabel="label"
              optionValue="value"
              [value]="selectedStatus()"
              (valueChange)="onStatusChange($event)"
            />
          </ui-form-field>
        </ui-grid>

        <ui-grid [size]="{ xs: 12, md: 3 }">
          <ui-form-field label="Deleted records" for="includeDeleted">
            <ui-select-field
              id="includeDeleted"
              [options]="deletedOptions"
              optionLabel="label"
              optionValue="value"
              [value]="includeDeleted()"
              (valueChange)="onIncludeDeletedChange($event)"
            />
          </ui-form-field>
        </ui-grid>
      </ui-grid>
    </ui-stack>
  </ui-card>

  <app-commodities-table
    [data]="store.data()"
    [isLoading]="store.isLoading()"
    [error]="store.error()"
    [isEmpty]="store.isEmpty()"
    [totalRecords]="store.totalRecords()"
    [pageSize]="store.pageSize()"
    [first]="store.first()"
    [canManage]="canManage"
    (lazyLoad)="store.onLazyLoad($event)"
    (retry)="store.retry()"
    (addCommodity)="addCommodity()"
    (restoreCommodity)="restore($event)"
  />
</div>
