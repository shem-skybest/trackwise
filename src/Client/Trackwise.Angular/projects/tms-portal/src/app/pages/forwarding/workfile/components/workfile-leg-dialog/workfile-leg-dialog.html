<ui-dialog
  [header]="leg() ? 'Edit truck leg ' + leg()!.referenceNumber : 'Add truck leg'"
  [(open)]="open"
  [modal]="true"
  width="40rem"
  (opened)="onOpened()"
>
  <form [formRoot]="form">
    <ui-grid container spacing="3">
      <ui-grid [size]="{ xs: 12 }">
        <ui-form-field label="What the leg does" for="legRole" [required]="true">
          <ui-select-field
            id="legRole"
            [formField]="form.role"
            [options]="roleOptions"
            optionLabel="label"
            optionValue="value"
            (selectionChange)="setRole($event)"
          />
        </ui-form-field>
      </ui-grid>

      <ui-grid [size]="{ xs: 12, md: 6 }">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="text-sm font-medium">From</span>
          <ui-toggle-group
            size="sm"
            ariaLabel="Leg starts at"
            [options]="endOptions"
            [value]="model().fromKind"
            (valueChange)="setFromKind($event)"
          />
        </div>
        @if (model().fromKind === "port") {
          <ui-form-field label="Port" for="legFromPort" [required]="true">
            <app-search-terminal id="legFromPort" [formField]="form.fromTerminal" />
          </ui-form-field>
        } @else {
          <ui-form-field label="Site" for="legFromSite" [required]="true">
            <app-search-location
              id="legFromSite"
              [formField]="form.fromSite"
              [customerId]="customerId()"
            />
          </ui-form-field>
        }
      </ui-grid>

      <ui-grid [size]="{ xs: 12, md: 6 }">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="text-sm font-medium">To</span>
          <ui-toggle-group
            size="sm"
            ariaLabel="Leg ends at"
            [options]="endOptions"
            [value]="model().toKind"
            (valueChange)="setToKind($event)"
          />
        </div>
        @if (model().toKind === "port") {
          <ui-form-field label="Port" for="legToPort" [required]="true">
            <app-search-terminal id="legToPort" [formField]="form.toTerminal" />
          </ui-form-field>
        } @else {
          <ui-form-field label="Site" for="legToSite" [required]="true">
            <app-search-location
              id="legToSite"
              [formField]="form.toSite"
              [customerId]="customerId()"
            />
          </ui-form-field>
        }
      </ui-grid>

      <ui-grid [size]="{ xs: 12 }">
        <ui-form-field
          label="Containers"
          for="legSlots"
          [hint]="
            slotOptions().length
              ? 'One load per container. Leave empty for loose cargo.'
              : 'No containers on this workfile - the leg gets one load for loose cargo.'
          "
        >
          <ui-multiselect-field
            id="legSlots"
            [formField]="form.slotIds"
            [options]="slotOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Loose cargo"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>

      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field label="Pickup date" for="legPickupDate" hint="Optional">
          <ui-date-field inputId="legPickupDate" [formField]="form.pickupDate" [showIcon]="true" />
        </ui-form-field>
      </ui-grid>

      <ui-grid [size]="{ xs: 12, md: 6 }">
        <ui-form-field
          label="Subcontract trucker"
          for="legTrucker"
          hint="Leave blank when our own truck does it"
        >
          <ui-select-field
            id="legTrucker"
            [formField]="form.truckerId"
            [options]="truckerOptions()"
            optionLabel="label"
            optionValue="value"
            placeholder="Our own truck"
            [filter]="true"
            [showClear]="true"
          />
        </ui-form-field>
      </ui-grid>

      <ui-grid [size]="{ xs: 12 }">
        <ui-form-field label="Notes" for="legNotes" hint="Optional, for dispatch and the crew">
          <ui-textarea-field id="legNotes" [formField]="form.notes" [rows]="2" />
        </ui-form-field>
      </ui-grid>
    </ui-grid>

    <div class="mt-4 flex justify-end gap-2">
      <ui-button appearance="text" label="Cancel" (click)="open.set(false)" />
      <ui-button
        type="submit"
        [icon]="leg() ? 'check' : 'plus'"
        [label]="leg() ? 'Save leg' : 'Add leg'"
        [loading]="form().submitting()"
      />
    </div>
  </form>
</ui-dialog>
