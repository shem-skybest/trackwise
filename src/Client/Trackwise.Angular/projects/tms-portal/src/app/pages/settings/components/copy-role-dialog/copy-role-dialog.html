<ui-dialog header="Copy a role" [(open)]="visible" [modal]="true" maxWidth="28rem">
  <form [formRoot]="form">
    <ui-form-field label="Copy permissions from" for="copyFrom" [required]="true">
      <ui-select-field
        id="copyFrom"
        [formField]="form.copyFrom"
        appendTo="body"
        [options]="sources()"
        optionValue="name"
        optionLabel="displayName"
      />
    </ui-form-field>

    <ui-form-field
      label="New role name"
      for="displayName"
      [required]="true"
      hint="For example: CS + Dispatch Cebu"
      class="mt-4"
    >
      <ui-text-field id="displayName" [formField]="form.displayName" />
    </ui-form-field>

    <div class="mt-6 flex justify-end gap-2">
      <ui-button label="Cancel" appearance="text" intent="secondary" (click)="visible.set(false)" />
      <ui-button type="submit" label="Create role" icon="copy" [loading]="form().submitting()" />
    </div>
  </form>
</ui-dialog>
