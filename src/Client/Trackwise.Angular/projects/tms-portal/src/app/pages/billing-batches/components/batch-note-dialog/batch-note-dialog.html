<ui-dialog [header]="header()" [(open)]="open" [modal]="true" width="30rem" (opened)="onOpened()">
  <form [formRoot]="form">
    <ui-form-field [label]="label()" for="batchNote" [required]="true" [hint]="hint()">
      @if (multiline()) {
        <ui-textarea-field id="batchNote" [formField]="form.text" [rows]="3" />
      } @else {
        <ui-text-field id="batchNote" [formField]="form.text" />
      }
    </ui-form-field>

    <div class="mt-4 flex justify-end gap-2">
      <ui-button appearance="text" label="Cancel" (click)="open.set(false)" />
      <ui-button
        type="submit"
        [intent]="danger() ? 'danger' : 'primary'"
        [label]="confirmLabel()"
        [loading]="form().submitting()"
      />
    </div>
  </form>
</ui-dialog>
