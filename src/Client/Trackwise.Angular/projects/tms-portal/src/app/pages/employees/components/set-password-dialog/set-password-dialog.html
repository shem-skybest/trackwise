<ui-dialog
  [(open)]="visible"
  [modal]="true"
  header="Set password"
  width="480px"
  [draggable]="false"
  [resizable]="false"
>
  <form [formRoot]="form">
    <ui-stack gap="3">
      <ui-typography variant="body" color="muted">
        Sets the password {{ employeeName() }} signs in with, on the web and in the driver app. Any
        password they had before stops working. Tell them the new one in person.
      </ui-typography>

      @if (loginEmail()) {
        <ui-typography variant="body">
          Sign-in email:
          <strong class="break-all">{{ loginEmail() }}</strong>
        </ui-typography>
      }

      <ui-form-field label="New password" for="newPassword" [required]="true">
        <ui-password-field id="newPassword" [formField]="form.password" />
      </ui-form-field>

      <ui-form-field label="Confirm password" for="confirmPassword" [required]="true">
        <ui-password-field id="confirmPassword" [formField]="form.confirm" />
      </ui-form-field>

      <ui-stack direction="row" justify="end" gap="2">
        <ui-button intent="secondary" appearance="outlined" label="Cancel" (click)="close()" />
        <ui-button type="submit" label="Set password" icon="key" [loading]="form().submitting()" />
      </ui-stack>
    </ui-stack>
  </form>
</ui-dialog>
