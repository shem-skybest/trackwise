<ui-grid container spacing="3">
  <ui-grid [size]="{ xs: 12, lg: 9, xl: 8 }">
    <form [formRoot]="form">
      <ui-stack gap="4">
        <ui-stack tag="section" gap="3">
          <ui-stack direction="row" gap="2" align="start">
            <ui-icon name="truck" color="secondary" class="mt-1" />
            <ui-stack gap="0">
              <ui-typography variant="overline" color="secondary">Trailer Details</ui-typography>
              <ui-typography variant="caption" color="muted">
                The canonical record for this trailer.
              </ui-typography>
            </ui-stack>
          </ui-stack>

          <ui-surface variant="elevated" [border]="true">
            <ui-stack gap="3">
              <ui-grid container spacing="3">
                <ui-grid [size]="{ xs: 12, md: 8 }">
                  <ui-form-field label="Name" for="name" [required]="true">
                    <ui-text-field id="name" [formField]="form.name" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field label="Code" for="code" [hint]="codeHint()">
                    <ui-text-field id="code" [formField]="form.code" type="text" [maxlength]="30" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field label="Type" for="type" [required]="true">
                    <ui-select-field
                      id="type"
                      [formField]="form.type"
                      [options]="typeOptions"
                      optionLabel="label"
                      optionValue="value"
                    />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field label="VIN" for="vin" hint="17 characters, if known">
                    <ui-text-field id="vin" [formField]="form.vin" type="text" [maxlength]="17" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 4 }">
                  <ui-form-field
                    label="Branch"
                    for="branchId"
                    hint="One branch, or every branch if shared"
                  >
                    <ui-select-field
                      id="branchId"
                      [formField]="form.branchId"
                      [options]="branchOptions()"
                      optionLabel="label"
                      optionValue="value"
                    />
                  </ui-form-field>
                </ui-grid>
              </ui-grid>

              <ui-form-field label="Active" for="isActive">
                <ui-toggle-field
                  id="isActive"
                  [formField]="form.isActive"
                  label="Offered for new work"
                />
              </ui-form-field>
            </ui-stack>
          </ui-surface>
        </ui-stack>

        <ui-stack tag="section" gap="3">
          <ui-stack direction="row" gap="2" align="start">
            <ui-icon name="settings" color="secondary" class="mt-1" />
            <ui-stack gap="0">
              <ui-typography variant="overline" color="secondary">Specifications</ui-typography>
              <ui-typography variant="caption" color="muted">Optional.</ui-typography>
            </ui-stack>
          </ui-stack>

          <ui-surface variant="elevated" [border]="true">
            <ui-stack gap="3">
              <ui-grid container spacing="3">
                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="License Plate" for="licensePlate">
                    <ui-text-field id="licensePlate" [formField]="form.licensePlate" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Plate State" for="licensePlateState">
                    <ui-text-field
                      id="licensePlateState"
                      [formField]="form.licensePlateState"
                      type="text"
                    />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Make" for="make">
                    <ui-text-field id="make" [formField]="form.make" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Model" for="model">
                    <ui-text-field id="model" [formField]="form.model" type="text" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Year" for="year">
                    <ui-number-field id="year" [formField]="form.year" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Axle Count" for="axleCount">
                    <ui-number-field id="axleCount" [formField]="form.axleCount" />
                  </ui-form-field>
                </ui-grid>

                <ui-grid [size]="{ xs: 12, md: 3 }">
                  <ui-form-field label="Max Load Capacity (kg)" for="maxLoadCapacityKg">
                    <ui-number-field id="maxLoadCapacityKg" [formField]="form.maxLoadCapacityKg" />
                  </ui-form-field>
                </ui-grid>
              </ui-grid>

              <ui-form-field label="Notes" for="notes" hint="Optional">
                <ui-textarea-field id="notes" [formField]="form.notes" [rows]="3" />
              </ui-form-field>
            </ui-stack>
          </ui-surface>
        </ui-stack>

        <ui-stack direction="row" gap="2" align="center">
          <ui-button type="submit" icon="save" [label]="submitLabel()" [disabled]="isLoading()" />

          <ui-button
            type="button"
            appearance="text"
            icon="arrow-left"
            label="Cancel"
            [routerLink]="['/master-data/trailers']"
            [disabled]="isLoading()"
          />
        </ui-stack>
      </ui-stack>
    </form>
  </ui-grid>
</ui-grid>
