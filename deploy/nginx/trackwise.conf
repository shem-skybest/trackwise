# Trackwise Nginx Configuration (host-managed reverse proxy)
#
# The proxy_pass ports below must match the host ports published by deploy/docker-compose.yml;
# the canonical port table lives in docs/deployment/docker-deployment.md.
#
# This file is the source of truth; it is NOT deployed by CI. Apply changes manually:
#   1. sudo cp trackwise.conf /etc/nginx/sites-available/trackwise.conf
#   2. sudo ln -s /etc/nginx/sites-available/trackwise.conf /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# SSL with Certbot (run after nginx is configured and DNS A-records exist):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.skybest.com.ph -d id.skybest.com.ph -d trackwise.skybest.com.ph -d admin.skybest.com.ph
#   sudo certbot renew --dry-run   # verify auto-renewal
#
# customer-portal / website / portainer server blocks are commented out below - only API,
# Identity Server, TMS Portal, and Admin Portal are deployed right now. Uncomment and give them
# a real hostname when those services go live.

map $http_connection $connection_upgrade {
    "~*Upgrade" $http_connection;
    default keep-alive;
}

# API
server {
    listen 80;
    listen [::]:80;
    server_name api.skybest.com.ph;

    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Identity Server
server {
    listen 80;
    listen [::]:80;
    server_name id.skybest.com.ph;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger buffer sizes for auth cookies/headers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# TMS Portal (Trackwise)
server {
    listen 80;
    listen [::]:80;
    server_name trackwise.skybest.com.ph;

    location / {
        proxy_pass http://127.0.0.1:7003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin App
server {
    listen 80;
    listen [::]:80;
    server_name admin.skybest.com.ph;

    location / {
        proxy_pass http://127.0.0.1:7002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Larger buffer sizes for auth cookies/headers
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

